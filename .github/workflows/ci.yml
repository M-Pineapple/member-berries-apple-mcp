name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: member-berries
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install
        run: bun install --frozen-lockfile
      - name: Test
        run: bun test
      - name: Typecheck version pin
        run: |
          PKG=$(bun -e 'console.log(require("./package.json").version)')
          VER=$(bun -e 'import { VERSION } from "./version.ts"; console.log(VERSION)')
          test "$PKG" = "$VER"
      - name: Build
        run: bun run build
      - name: Smoke test built server on Node
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | timeout 10 node dist/index.js | grep -q '"serverInfo"'
      - name: Check package contents
        run: npm pack --dry-run
