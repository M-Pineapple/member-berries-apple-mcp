name: Publish

# npm Trusted Publishing (GitHub Actions OIDC). No long-lived npm token.
# Trusted Publisher on npmjs.com: owner M-Pineapple, repo member-berries-apple-mcp,
# workflow publish.yml. Push a v* tag that matches member-berries/package.json.

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: member-berries
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      - run: bun test

      - name: Guard release version
        run: |
          set -euo pipefail
          PKG_VERSION="$(node -p "require('./package.json').version")"
          SRC_VERSION="$(bun -e 'import { VERSION } from "./version.ts"; console.log(VERSION)')"
          if [ "$SRC_VERSION" != "$PKG_VERSION" ]; then
            echo "version.ts '${SRC_VERSION}' does not match package.json '${PKG_VERSION}'."
            exit 1
          fi
          EXPECTED="v${PKG_VERSION}"
          if [ "${GITHUB_REF_NAME}" != "$EXPECTED" ]; then
            echo "Git tag '${GITHUB_REF_NAME}' does not match package.json version (expected '${EXPECTED}')."
            exit 1
          fi
          echo "Release versions match: ${EXPECTED}"

      - run: bun run build

      - name: Publish to npm
        run: |
          set -euo pipefail
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already on npm. Skipping npm publish."
            exit 0
          fi
          npm publish --provenance --access public
